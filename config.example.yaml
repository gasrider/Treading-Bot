# ===================== Trading-Bot Konfiguration =====================
# mode: paper  -> echte Kurse, virtuelles Geld (EMPFOHLEN zum Start)
# mode: live   -> echtes Geld! Erst nach mehreren Wochen Paper-Trading.
mode: paper

exchange: kraken            # Krypto-Börse für paper/live (kraken, bitvavo, binance, ...)
symbols: [BTC/EUR, ETH/EUR, SOL/EUR]  # Krypto-Paare (alle mit derselben Quote-Währung!)
timeframe: 1h               # Kerzen-Intervall: 15m, 30m, 1h, 4h, 1d

# Weitere Märkte (Kursdaten von Yahoo Finance) – vorerst NUR im Paper-Modus.
# Ticker wie auf finance.yahoo.com: US-Aktien ohne Endung, Xetra .DE, Wien .VI, Paris .PA,
# Amsterdam .AS, Schweiz .SW, Rohstoffe =F (Futures), Devisen EURUSD=X.
universe:
  stocks: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, JPM, SAP.DE, SIE.DE, ALV.DE, ASML.AS, MC.PA,
           OMV.VI, EBS.VI, VER.VI, NESN.SW]
  etfs: [SPY, QQQ, IWDA.AS, EXS1.DE, VWCE.DE, EEM]
  commodities: ["GC=F", "SI=F", "CL=F", "NG=F", "HG=F"]   # Gold, Silber, Öl, Erdgas, Kupfer
  forex: ["EURUSD=X", "EURCHF=X", "EURGBP=X", "EURJPY=X"]

costs:                      # Gebühr + Spread je Order und Anlageklasse (Schätzwerte; Krypto: paper/backtest)
  stocks: {fee: 0.001, slippage: 0.0005}
  etfs: {fee: 0.001, slippage: 0.0003}
  commodities: {fee: 0.0005, slippage: 0.0003}
  forex: {fee: 0.0, slippage: 0.0001}

scanner:
  top_pct: 0.5              # nur Kaufsignale der stärksten 50 % aller Märkte annehmen

regime:                     # Gesamtmarktlage aus S&P 500 (200-Tage-Linie) und VIX
  enabled: true
  vix_caution: 22           # VIX darüber -> nur halbes Risiko
  vix_panic: 30             # VIX darüber -> keine neuen Käufe

ai:                         # KI als Risikomanager – braucht GEMINI_API_KEY (gratis) oder ANTHROPIC_API_KEY in .env
  mode: veto                # off | advisory (nur Hinweise) | veto (darf Käufe verhindern)
  provider: auto            # auto = Gemini (kostenlos), wenn Schlüssel vorhanden, sonst Claude | gemini | claude
  gemini_model: gemini-3.8-flash
  gemini_fallback_model: gemini-3.5-flash-lite
  model: claude-opus-5-5    # nur für Claude
  web_search: true          # tägliche Marktanalyse mit aktuellen Nachrichten
  monthly_budget_usd: 20    # Obergrenze; danach entscheiden die Regeln allein
  on_error: approve         # approve = bei KI-Ausfall entscheiden die Regeln | reject = dann nicht kaufen

strategy:                   # Trendfolge: EMA-Kreuzung + Trendfilter + ATR-Stops
  ema_fast: 20
  ema_slow: 50
  ema_trend: 200            # nur kaufen, wenn Kurs über dieser EMA (Aufwärtstrend)
  rsi_period: 14
  rsi_max_entry: 70         # nicht kaufen, wenn überkauft
  atr_period: 14
  stop_atr: 2.0             # Stop-Loss = Einstieg - 2 x ATR
  take_profit_atr: 4.0      # Take-Profit = Einstieg + 4 x ATR (0 = aus)
  trailing_atr: 2.5         # Nachziehender Stop: Hoch - 2.5 x ATR (0 = aus)

risk:
  risk_per_trade: 0.01      # max. 1 % des Kontos Verlust pro Trade
  max_position_pct: 0.25    # max. 25 % des Kontos in einer Position
  max_open_positions: 4
  max_daily_loss: 0.03      # -3 % an einem Tag -> keine neuen Trades bis morgen
  max_drawdown: 0.15        # -15 % vom Höchststand -> alles verkaufen + Bot stoppt
  min_order_value: 10       # Mindest-Ordergröße in Quote-Währung (EUR)

paper:
  starting_balance: 1000    # virtuelles Startkapital in EUR
  fee: 0.0026               # Gebühr pro Order (Kraken Taker ~0.26 %)
  slippage: 0.0005

backtest:
  data_exchange: binance    # Börse für historische Daten (öffentlich, kein Konto nötig)
  days: 730
  starting_balance: 1000
  fee: 0.0026
  slippage: 0.0005

loop:
  poll_seconds: 60          # wie oft der Bot den Markt prüft
