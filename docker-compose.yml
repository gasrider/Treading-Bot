services:
  tradingbot:
    build: .
    container_name: tradingbot
    restart: unless-stopped        # startet nach Absturz/Neustart automatisch neu
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./state:/app/state         # Kontostand, Positionen, Not-Aus-Datei
      - ./logs:/app/logs
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
